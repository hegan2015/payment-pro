# I-8 可观测：本域无业务 HTTP，内嵌 Tomcat 仅承载 actuator（1808x 与 Dubbo 2088x 错开）
server:
  port: ${RECON_HTTP_PORT:18091}

spring:
  application:
    name: payment-recon
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/recon;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# S-4 差错自动修复灰度开关：默认 false=影子模式（只建单+建议策略，不自动动账）。
# local/docker 双 profile 同默认；开启后调度/autofix-run 按策略执行红冲/挂账/重放。
recon:
  dispute:
    autofix: ${RECON_DISPUTE_AUTOFIX:false}

dubbo:
  application:
    name: payment-recon
    qos-enable: false
  registry:
    address: zookeeper://127.0.0.1:${ZK_PORT:2181}
  protocol:
    name: dubbo
    port: ${RECON_DUBBO_PORT:20891}
  provider:
    timeout: 5000
    retries: 0
  consumer:
    check: false
    timeout: 5000
    retries: 0

# I-3 分布式调度：local 零依赖（不连 XXL-Job）；reconRun 只由触发驱动（不新增本地周期对账，保持现状）。
payment:
  # I-5a ShardingSphere 试点：local 恒 false —— 不加载任何 ShardingSphere Bean、不建分片连接，
  # 直连 H2 单库单表，取号仍走 next_value_for('seq_recon')，行为逐字节不变。
  sharding:
    enabled: false
  job:
    xxl:
      enabled: false
    local:
      enabled: true
    shedlock:
      enabled: true

# I-8 可观测：local 零依赖暴露端点，docker 供共享栈 Prometheus scrape
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,ppjob,pprecon,ppshard
  endpoint:
    health:
      show-details: always