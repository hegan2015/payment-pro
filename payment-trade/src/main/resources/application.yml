# I-8 可观测：本域无业务 HTTP，内嵌 Tomcat 仅承载 actuator（1808x 与 Dubbo 2088x 错开）
server:
  port: ${TRADE_HTTP_PORT:18084}

spring:
  application:
    name: payment-trade
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/trade;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# I-5b 资金域分库分表：local 恒 false —— 不加载任何 ShardingSphere Bean、不建分片连接，
# 直连 H2 单库单表，取号仍走 next_value_for('seq_order')，行为逐字节不变。
payment:
  sharding:
    enabled: false

dubbo:
  application:
    name: payment-trade
    qos-enable: false
  registry:
    address: zookeeper://127.0.0.1:${ZK_PORT:2181}
  protocol:
    name: dubbo
    port: ${TRADE_DUBBO_PORT:20884}
  provider:
    timeout: 5000
    retries: 0
  consumer:
    check: false
    timeout: 5000
    retries: 0

# I-8 可观测：local 零依赖暴露端点，docker 供共享栈 Prometheus scrape
# ppjob：I-3 作业运维端点（T-4 tradeOrderExpire / T-1 escrowAutoConfirm 手动触发，内网运维面不经网关）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,ppshard,ppjob,pptrade
  endpoint:
    health:
      show-details: always

# P1 · G 泳道交易产品工作流（T-3/T-1/T-2/T-4）默认值：
#   产品参数/超时策略运行时经 I-2 DynamicConfig 覆盖（local ~/.config/payment-pro/config.properties）；
#   两个自动跑批开关默认 false —— 只由 XXL-Job / 控制台 / /actuator/ppjob 触发，不干扰既有断言。
trade:
  job:
    scan-interval-ms: 60000