# I-8 可观测：本域无业务 HTTP，内嵌 Tomcat 仅承载 actuator（1808x 与 Dubbo 2088x 错开）
server:
  port: ${NOTIFY_HTTP_PORT:18090}

spring:
  application:
    name: payment-notify
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/notify;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: payment-notify
    qos-enable: false
  registry:
    address: zookeeper://127.0.0.1:${ZK_PORT:2181}
  protocol:
    name: dubbo
    port: ${NOTIFY_DUBBO_PORT:20890}
  provider:
    timeout: 5000
    retries: 0
  consumer:
    check: false
    timeout: 5000
    retries: 0

# I-3 分布式调度：local 零依赖（不连 XXL-Job），@Scheduled(fixedDelay=3000) 语义不变 + ShedLock H2 锁。
payment:
  job:
    xxl:
      enabled: false
    local:
      enabled: true
    shedlock:
      enabled: true

# I-8 可观测：local 零依赖暴露端点，docker 供共享栈 Prometheus scrape
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,ppjob
  endpoint:
    health:
      show-details: always