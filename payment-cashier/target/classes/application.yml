spring:
  application:
    name: payment-cashier
  main:
    web-application-type: none

dubbo:
  application:
    name: payment-cashier
    qos-enable: false
  registry:
    address: zookeeper://127.0.0.1:${ZK_PORT:2181}
  protocol:
    name: dubbo
    port: ${CASHIER_DUBBO_PORT:20886}
  provider:
    timeout: 5000
    retries: 0
  consumer:
    check: false
    timeout: 5000
    retries: 0