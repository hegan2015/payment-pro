spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  # R-1~R-4：docker MySQL pp_risk（建库/建表一次性执行 schema-mysql.sql，见 verify-risk.py 前置）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/pp_risk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: never

payment:
  risk:
    redis:
      enabled: true
  # I-2 配置中心（参考段，其余域由主会话集成期同构补齐；env 经 relaxed binding 亦可直达）：
  # 默认 false=local 文件降级同构；docker 启用 Apollo 在 ~/.config/payment-pro/docker.env 置
  # PAYMENT_CONFIG_APOLLO_ENABLED=true + APOLLO_META（见 config/apollo.env.example）。
  config:
    apollo:
      enabled: ${PAYMENT_CONFIG_APOLLO_ENABLED:false}
      meta: ${APOLLO_META:http://127.0.0.1:18070}
      app-id: ${PAYMENT_CONFIG_APOLLO_APP_ID:payment-pro}
      namespaces: ${PAYMENT_CONFIG_APOLLO_NAMESPACES:application,risk-rules,channel-route,settle-fee}

# I-8：docker 共享栈 Redis 在位，恢复健康检查
management:
  health:
    redis:
      enabled: true